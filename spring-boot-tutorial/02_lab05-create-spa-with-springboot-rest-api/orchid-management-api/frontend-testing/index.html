<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        async function fetchData() {
            alert('Fetching data...');
            try {
                const response = await fetch('http://localhost:8080/orchids');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                console.log(data);
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        async function postData() {
            const name = document.getElementById('name').value;
            const natural = document.getElementById('natural').checked;
            const image = document.getElementById('image').value;

            const orchidData = {
                orchidName: name,
                natural: natural,
                image: image
            };

            try {
                const response = await fetch('http://localhost:8080/orchids', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(orchidData)
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const data = await response.json();
                console.log('Data posted successfully:', data);
            } catch (error) {
                console.error('Error posting data:', error);
            }
        }
    </script>

</head>
<body>
    <h1>Test JavaScript Fetch API</h1>
    <form>
        <h2> Create Orchid Form</h2>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br>
        <label for="natural">Natural:</label>
        <input type="checkbox" id="natural" name="natural"><br>
        <label for="image">Image URL:</label>
        <input type="text" id="image" name="image"><br>
    </form>
    <button onclick="fetchData()">Fetch Data</button>
    <button onclick="postData()">Post Data</button>
</body>
</html>
